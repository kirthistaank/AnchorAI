[project]
name = "anchorai"
version = "0.1.0"
description = "Personal wellness AI agent with CBT support"
requires-python = ">=3.12"
authors = [
    {name = "Kirthi"}
]

dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "sqlalchemy==2.0.23",
    "psycopg2-binary==2.9.9",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "neo4j==5.14.0",
    "litellm==1.26.3",
    "anthropic==0.29.0",
    "python-dotenv==1.0.0",
    "httpx==0.25.2",
    "langgraph>=0.1.0,<0.2",
    "langchain-core>=0.2.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "pyjwt>=2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
]

phase2 = [
    "langgraph>=0.1.0,<0.2",
    "langchain-core>=0.2.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.2.2",
]

phase15 = [
    "bcrypt==4.1.1",
    "python-jose[cryptography]==3.3.0",
    "PyJWT==2.13.0",
    "passlib[bcrypt]==1.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
